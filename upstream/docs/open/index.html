<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Publit</title>
<!-- Landing page for links shared from Publit. Everything after # stays in the browser:
     it is never sent to GitHub. The page only shows it and hands it to the app or to a map. -->
<style>
  :root { --accent: #0066d6; --bg: #f2f2f7; --card: #fff; --text: #000; --muted: #6c6c70; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --accent: #0a84ff; --bg: #000; --card: #1c1c1e; --text: #fff; --muted: #98989f; } }
  body { margin: 0; font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 440px; margin: 0 auto; padding: 32px 20px; }
  .card { background: var(--card); border-radius: 18px; padding: 22px; }
  img { width: 52px; height: 52px; border-radius: 12px; }
  h1 { font-size: 24px; margin: 12px 0 4px; overflow-wrap: anywhere; }
  p { margin: 4px 0; color: var(--muted); }
  a.button { display: block; text-align: center; text-decoration: none; padding: 14px; border-radius: 12px; margin-top: 12px;
             font-weight: 600; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
  a.button.primary { background: var(--accent); color: #fff; margin-top: 20px; }
  .note { font-size: 14px; margin-top: 18px; }
</style>
</head>
<body>
<main>
  <div class="card">
    <img src="icon.svg" alt="">
    <h1 id="title">Publit</h1>
    <p id="subtitle"></p>
    <a class="button primary" id="open" href="#">Open in Publit</a>
    <div id="maps"></div>
    <p class="note" id="note"></p>
  </div>
</main>
<script>
(function () {
  var de = (navigator.language || "").toLowerCase().indexOf("de") === 0;
  var t = de ? {
    open: "In Publit öffnen", route: "Verbindung", stop: "Abfahrten", leaves: "Abfahrt",
    apple: "In Apple Karten", google: "In Google Maps",
    note: "In Publit siehst du die Verbindung mit Live-Zeiten. Ohne Publit hilft die Karte weiter.",
    empty: "Dieser Link ist unvollständig."
  } : {
    open: "Open in Publit", route: "Route", stop: "Departures", leaves: "Leaves",
    apple: "In Apple Maps", google: "In Google Maps",
    note: "Publit shows the route with live times. Without Publit, the map still helps.",
    empty: "This link is incomplete."
  };
  document.documentElement.lang = de ? "de" : "en";
  var hash = location.hash.slice(1);
  var q = hash.indexOf("?");
  var path = q < 0 ? hash : hash.slice(0, q);
  var params = new URLSearchParams(q < 0 ? "" : hash.slice(q + 1));
  var kind = path.split("/")[0];
  function el(id) { return document.getElementById(id); }
  function latlon(s) {
    var p = (s || "").split(",").map(Number);
    return p.length === 2 && isFinite(p[0]) && isFinite(p[1]) && Math.abs(p[0]) <= 90 && Math.abs(p[1]) <= 180 ? p.join(",") : null;
  }
  function mapLink(label, href) {
    var a = document.createElement("a");
    a.className = "button"; a.textContent = label; a.href = href; a.rel = "noopener";
    el("maps").appendChild(a);
  }
  el("open").textContent = t.open;
  el("note").textContent = t.note;
  if (!hash) { el("subtitle").textContent = t.empty; el("open").style.display = "none"; return; }
  // Only the publit scheme is ever opened from here.
  el("open").href = "publit://" + hash;
  if (kind === "route") {
    var from = params.get("f") || "", to = params.get("t") || "";
    var a = latlon(params.get("fl")), b = latlon(params.get("tl"));
    var d = new Date(Number(params.get("d")) * 1000);
    document.title = el("title").textContent = (from || t.route) + " → " + (to || "");
    if (!isNaN(d)) {
      el("subtitle").textContent = t.leaves + " " + d.toLocaleString(de ? "de-DE" : undefined,
        { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    }
    if (a && b) {
      mapLink(t.apple, "https://maps.apple.com/?saddr=" + a + "&daddr=" + b + "&dirflg=r");
      mapLink(t.google, "https://www.google.com/maps/dir/?api=1&origin=" + a + "&destination=" + b + "&travelmode=transit");
    }
  } else if (kind === "stop") {
    var name = params.get("name") || "";
    var ll = latlon(params.get("lat") + "," + params.get("lon"));
    document.title = el("title").textContent = name || t.stop;
    el("subtitle").textContent = t.stop;
    if (ll) {
      mapLink(t.apple, "https://maps.apple.com/?ll=" + ll + "&q=" + encodeURIComponent(name));
      mapLink(t.google, "https://www.google.com/maps/search/?api=1&query=" + ll);
    }
  }
})();
</script>
</body>
</html>
