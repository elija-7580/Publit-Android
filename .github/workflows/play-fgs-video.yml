name: Play-Video Standort-Vordergrunddienst

# Screen video for Google Play's foreground service declaration (FOREGROUND_SERVICE_LOCATION):
# a started trip in the emulator with demo data, the app in the background, the ongoing notification.
# Same emulator and demo server as "Website-Screenshots erstellen". The video goes to the pre-release
# "play-assets" (fgs-location-demo.mp4), whose download link is given to Google.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-gx2ziz]
    paths: ['android-native/screenshots/fgs_video.py', '.github/workflows/play-fgs-video.yml']

permissions:
  contents: write

concurrency:
  group: play-fgs-video
  cancel-in-progress: true

env:
  SYSTEM_IMAGE: 'system-images;android-35;google_apis;x86_64'
  OUT: ${{ github.workspace }}/shots

jobs:
  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Strings from the iOS catalog
        run: |
          bash scripts/fetch-ios-strings.sh
          python3 android-native/tools/strings.py Sources/Publit/Resources/Localizable.xcstrings android-native/app/src/main/assets/strings
      - name: Build the screenshot APK (x86_64)
        working-directory: android-native
        run: gradle --no-daemon -Ppublit.emulatorAbi=true :app:assemblePlayScreenshots 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Tools
        run: |
          pip install -q pillow numpy
          mkdir -p "$OUT/diagnostics"
      - name: Emulator (Pixel 8 Pro, API 35)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          export ANDROID_AVD_HOME="$HOME/.android/avd"; mkdir -p "$ANDROID_AVD_HOME"; echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          SDK="$ANDROID_HOME"; BIN="$SDK/cmdline-tools/latest/bin"
          yes | "$BIN/sdkmanager" --licenses >/dev/null || true
          "$BIN/sdkmanager" --install emulator platform-tools "$SYSTEM_IMAGE" >/dev/null
          DEV=pixel_8_pro; "$BIN/avdmanager" list device -c | grep -qx pixel_8_pro || DEV=pixel_7_pro
          echo no | "$BIN/avdmanager" create avd -n shots -k "$SYSTEM_IMAGE" -d "$DEV" --force
          CFG="$ANDROID_AVD_HOME/shots.avd/config.ini"; echo "AVD config: $CFG"; test -f "$CFG"
          sed -i '/^hw.lcd.width\|^hw.lcd.height\|^hw.lcd.density\|^skin\.\|^showDeviceFrame\|^hw.ramSize\|^disk.dataPartition.size\|^hw.keyboard\|^hw.gpu/d' "$CFG"
          printf '%s\n' hw.lcd.width=1344 hw.lcd.height=2992 hw.lcd.density=480 skin.name=1344x2992 skin.dynamic=yes \
            showDeviceFrame=no hw.ramSize=4096 disk.dataPartition.size=6G hw.keyboard=yes hw.gpu.enabled=yes hw.gpu.mode=swiftshader_indirect >> "$CFG"
          cp "$CFG" "$OUT/diagnostics/avd-config.ini"
          nohup "$SDK/emulator/emulator" -avd shots -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect \
            -timezone Europe/Berlin -camera-back none -camera-front none -netfast > "$OUT/diagnostics/emulator.log" 2>&1 &
          export PATH="$SDK/platform-tools:$PATH"
          timeout 300 adb wait-for-device || { echo "::error::Emulator did not appear"; tail -50 "$OUT/diagnostics/emulator.log"; exit 1; }
          for i in $(seq 1 120); do [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break; sleep 5; done
          adb shell getprop sys.boot_completed | grep -q 1
          sleep 20; adb shell input keyevent 82 || true
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
      - name: Record
        working-directory: android-native/screenshots
        run: |
          nohup python3 mock_server.py --fixtures fixtures/munich --port 8765 --log "$OUT/diagnostics/requests.jsonl" > "$OUT/diagnostics/server.log" 2>&1 &
          sleep 2; curl -fsS "http://127.0.0.1:8765/_demo/stats" >/dev/null
          python3 fgs_video.py --apk ../app/build/outputs/apk/play/screenshots/app-play-x86_64-screenshots.apk --out "$OUT" --server http://127.0.0.1:8765
      - name: Diagnostics
        if: always()
        run: |
          adb exec-out screencap -p > "$OUT/diagnostics/end.png" 2>/dev/null || true
          cd "$OUT" && zip -qr diagnostics.zip diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: fgs-video, path: "${{ env.OUT }}/fgs-location-demo.mp4\n${{ env.OUT }}/diagnostics.zip" }
      - name: Publish to the pre-release "play-assets"
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          TAG=play-assets; R="--repo $GITHUB_REPOSITORY"
          gh release view $TAG $R >/dev/null 2>&1 || gh release create $TAG $R --title "Google Play: Begleitmaterial" --notes "Material für Erklärungen in der Play Console (z. B. Video zum Standort-Vordergrunddienst). Keine App zum Installieren." --prerelease --target "$GITHUB_SHA"
          gh release upload $TAG $R "$OUT/fgs-location-demo.mp4" --clobber
