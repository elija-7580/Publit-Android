name: Android Play bundle

# Signed App Bundles (.aab) for the Play Console: phone app and Wear OS app, signed with the Play upload key.
# Run by hand (Actions → "Android Play bundle" → Run workflow) on native-android or a tag. Needs these secrets:
#   PLAY_UPLOAD_KEYSTORE_B64   the upload keystore (.jks), base64
#   PLAY_UPLOAD_STORE_PASSWORD, PLAY_UPLOAD_KEY_ALIAS, PLAY_UPLOAD_KEY_PASSWORD
# The bundles are kept as a workflow artifact (14 days), not published: upload them in the Play Console.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Strings from the iOS catalog
        run: |
          bash scripts/fetch-ios-strings.sh
          python3 android-native/tools/strings.py Sources/Publit/Resources/Localizable.xcstrings android-native/app/src/main/assets/strings
      - name: Upload key
        env: { KEYSTORE: '${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}' }
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::Secret PLAY_UPLOAD_KEYSTORE_B64 is missing"; exit 1; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "PUBLIT_UPLOAD_STORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          # Above every test build number and growing with each run (Play needs a higher code for every upload).
          echo "PUBLIT_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Tests and signed bundles
        working-directory: android-native
        env:
          WALLET_SIGNER_URL: '${{ vars.WALLET_SIGNER_URL }}'
          PUBLIT_UPLOAD_STORE_PASSWORD: '${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}'
          PUBLIT_UPLOAD_KEY_ALIAS: '${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}'
          PUBLIT_UPLOAD_KEY_PASSWORD: '${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}'
        run: gradle --no-daemon ${WALLET_SIGNER_URL:+-Ppublit.walletSignerUrl=$WALLET_SIGNER_URL} :app:testReleaseUnitTest :app:bundleRelease :wear:bundleRelease
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: publit-play-bundles-${{ github.run_number }}
          retention-days: 14
          path: |
            android-native/app/build/outputs/bundle/release/app-release.aab
            android-native/wear/build/outputs/bundle/release/wear-release.aab
