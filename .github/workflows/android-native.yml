name: Android native

# Native Kotlin/Compose app (android-native/). Publishes the release APK as release "native-latest".
on:
  push:
    branches: [native-android]
    paths: ['android-native/**', '.github/workflows/android-native.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Strings from the iOS catalog
        run: |
          bash scripts/fetch-ios-strings.sh
          python3 android-native/tools/strings.py Sources/Publit/Resources/Localizable.xcstrings android-native/app/src/main/assets/strings
      - name: Unit tests and release APK
        working-directory: android-native
        run: gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease :wear:assembleRelease 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Errors only
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|What went wrong" -A3 android-native/build.log | head -120 > errors.txt; cat errors.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: errors, path: errors.txt }
      - name: Publish
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          OUT=android-native/app/build/outputs/apk/release
          cp $OUT/app-arm64-v8a-release.apk Publit-native.apk
          cp $OUT/app-armeabi-v7a-release.apk Publit-native-32bit.apk
          cp android-native/wear/build/outputs/apk/release/wear-release.apk Publit-wear.apk; ls -lh Publit-*.apk
          TAG=native-latest
          NOTES="Native Kotlin build of $(git rev-parse --short HEAD). Replaces the old Skip build of Publit (uninstall that once first: different signing key). Publit-native.apk for 64-bit phones, Publit-native-32bit.apk for older 32-bit ones, Publit-wear.apk for Wear OS watches."
          gh release view $TAG >/dev/null 2>&1 || gh release create $TAG --title "Publit native (test build)" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          gh release edit $TAG --notes "$NOTES"
          gh release upload $TAG Publit-native.apk Publit-native-32bit.apk Publit-wear.apk --clobber
